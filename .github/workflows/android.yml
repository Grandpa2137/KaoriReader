name: Android

on:
  push:
    branches: [main]
    # Sam opis nie wymaga budowania — pełny build na literówkę w README to strata minut
    # i szum w historii. Kod, gradle i workflow dalej odpala testy normalnie.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner Ubuntu ma już SDK Androida (ANDROID_HOME). setup-android@v3 wywalał się
      # na sdkmanagerze (exit 1), więc tylko dopisujemy licencje — wtedy Gradle sam
      # dociągnie brakującą platformę, jeśli obraz nie ma tej, której wymaga compileSdk.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # commit z Windowsa gubi bit +x na gradlew (exit 126)
          chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Unit tests
        working-directory: android
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/testReleaseUnitTest
          retention-days: 7
